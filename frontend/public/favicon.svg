  />

  <!-- Fold -->
  <path
    d="M37 14v10h9"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- AI sparkle -->
  <path
    d="M27 29
       C28.2 34 30 35.8 35 37
       C30 38.2 28.2 40 27 45
       C25.8 40 24 38.2 19 37
       C24 35.8 25.8 34 27 29Z"
