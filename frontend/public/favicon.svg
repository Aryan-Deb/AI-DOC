  />

  <!-- Small sparkle -->
  <path
    d="M39 29
       C39.6 31.4 40.6 32.4 43 33
       C40.6 33.6 39.6 34.6 39 37
       C38.4 34.6 37.4 33.6 35 33
       C37.4 32.4 38.4 31.4 39 29Z"
